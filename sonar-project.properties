sonar.projectDescription=Python client library for the Apple Ads Platform API
sonar.sources=apple_ads_platform
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=.out/coverage.xml
sonar.python.xunit.reportPath=.out/test-results/results.xml

# Generated code is excluded
sonar.coverage.exclusions=apple_ads_platform/api/**,apple_ads/models/**,apple_ads/api_client.py,apple_ads/api_response.py,apple_ads/configuration.py,apple_ads/exceptions.py,apple_ads/rest.py,apple_ads/__init__.py
sonar.cpd.exclusions=apple_ads_platform/api/**,apple_ads/models/**,apple_ads/api_client.py,apple_ads/api_response.py,apple_ads/configuration.py,apple_ads/exceptions.py,apple_ads/rest.py,apple_ads/__init__.py